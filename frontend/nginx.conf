server {
    listen 80;

    # 1. serve React Frontend (Single Page App)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # CRITICAL: This allows React Router to handle /login, /dashboard, etc.
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for API (Frontend -> Backend)
    location /api/ {
        # 'notsafe-backend' is the docker service name from docker-compose.yml
        proxy_pass http://notsafe-backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}