<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notSafe. | API Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    </style>
  </head>
  <body class="text-slate-300 min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="text-center max-w-4xl">
        
        <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-tighter mb-4">
            notSafe. <span class="text-red-500">API</span>
        </h1>
        
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-slate-800 rounded-full border border-slate-700 mb-16">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">System Online</span>
        </div>

        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-[0.3em] mb-10">Powered By</h2>
        
        <div class="flex flex-wrap justify-center gap-16 md:gap-24 items-end">
            
            <div class="flex flex-col items-center gap-4 group">
                <img src="{{ url_for('static', filename='img/flask.png') }}" 
                     class="w-14 h-14 object-contain opacity-50 group-hover:opacity-100 transition duration-300 grayscale group-hover:grayscale-0" 
                     alt="Flask">
                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition">FLASK</span>
            </div>

            <div class="flex flex-col items-center gap-4 group">
                <img src="{{ url_for('static', filename='img/react.png') }}" 
                     class="w-14 h-14 object-contain opacity-50 group-hover:opacity-100 transition duration-300 grayscale group-hover:grayscale-0" 
                     alt="React">
                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition">REACT</span>
            </div>

            <div class="flex flex-col items-center gap-4 group">
                <img src="{{ url_for('static', filename='img/mongo.png') }}" 
                     class="w-14 h-14 object-contain opacity-50 group-hover:opacity-100 transition duration-300 grayscale group-hover:grayscale-0" 
                     alt="MongoDB">
                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition">MONGODB</span>
            </div>

            <div class="flex flex-col items-center gap-4 group">
                <img src="{{ url_for('static', filename='img/python.png') }}" 
                     class="w-14 h-14 object-contain opacity-50 group-hover:opacity-100 transition duration-300 grayscale group-hover:grayscale-0" 
                     alt="Python">
                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition">PYTHON</span>
            </div>

        </div>

        <div class="mt-20 text-[10px] text-slate-700 font-mono">
            API ACCESS RESTRICTED • AUTHORIZED PERSONNEL ONLY
        </div>

    </div>

  </body>
</html>
